server {
  listen 80;
  server_name radio.example.com;

  # Production should terminate TLS and redirect HTTP so admin cookies can be Secure.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name radio.example.com;

  # Replace these with your certbot/acme paths.
  ssl_certificate /etc/letsencrypt/live/radio.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;

  root /opt/aips;

  location ^~ /public/radio-state/ { return 404; }
  location ^~ /.aips-state/ { return 404; }

  location /api/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /public/stream/ {
    alias /opt/aips/public/stream/;
    add_header Cache-Control no-store;
    add_header Access-Control-Allow-Origin "https://your-vercel-app.vercel.app" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location /public/archive/ {
    alias /var/lib/aips/media/archive/;
    add_header Cache-Control public;
    add_header Access-Control-Allow-Origin "https://your-vercel-app.vercel.app" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location /public/recordings/ {
    alias /var/lib/aips/media/recordings/;
    add_header Cache-Control public;
    add_header Access-Control-Allow-Origin "https://your-vercel-app.vercel.app" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location /public/sessions/ {
    alias /var/lib/aips/media/sessions/;
    add_header Cache-Control no-store;
    add_header Access-Control-Allow-Origin "https://your-vercel-app.vercel.app" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location / {
    try_files $uri $uri/ /web/new/index.html;
  }
}
